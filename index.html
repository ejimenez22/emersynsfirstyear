<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <meta name="theme-color" content="#000000">

    <title>Emersyn — Our First Year</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Opening -->
    <section id="openingScreen" class="screen active-screen">
        <div class="opening-content">
            <h1>Emersyn</h1>

            <p>Our First Year</p>

            <button id="beginButton" type="button">
                Begin
            </button>

            <span>Best experienced with sound</span>
        </div>
    </section>


    <!-- Film -->
    <main id="filmScreen" class="screen">

        <div id="mediaStage">

            <div
                id="blurredBackground"
                class="blurred-background"
            ></div>

            <div class="background-shade"></div>

            <img
                id="photoLayerOne"
                class="photo-layer"
                alt="A memory from Emersyn's first year"
            >

            <img
                id="photoLayerTwo"
                class="photo-layer"
                alt="A memory from Emersyn's first year"
            >

            <video
                id="videoLayer"
                class="video-layer"
                autoplay
                muted
                playsinline
                webkit-playsinline
                preload="auto"
            ></video>

            <div class="vignette"></div>
            <div class="film-grain"></div>

        </div>


        <!-- Opening dedication after Begin -->
        <div id="dedicationScene" class="dedication-scene">

            <p id="dedicationLineOne">
                For Emersyn...
            </p>

            <p id="dedicationLineTwo">
                Our little girl.
            </p>

        </div>

    </main>


    <!-- Ending message -->
    <section id="endingScreen" class="screen">

        <div id="endingText" class="ending-text">

            <p class="ending-intro">
                Happy First Birthday
            </p>

            <h2>Emersyn</h2>

            <p class="ending-message">
                You'll always be our little girl.
            </p>

            <p class="ending-love">
                Love,
                <br>
                Mom, Dad, Clayton &amp; Jakob
            </p>

        </div>

        <div id="replayScene" class="replay-scene">

            <div
                id="replayBackground"
                class="replay-background"
            ></div>

            <div class="replay-shade"></div>

            <button id="replayButton" type="button">
                Watch Again
            </button>

        </div>

    </section>


    <audio id="backgroundMusic" preload="auto">
        <source
            src="music/my-little-girl.m4a"
            type="audio/mp4"
        >
    </audio>


    <script src="media.js?v=3.2"></script>
    <script src="script.js?v=3.3"></script>

</body>
</html>
